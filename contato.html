            <div class="post">
                <h2>Envia uma mensagem</h2>
                <!--
                formulário com campos 
                -> Nome (texto)
                -> e-mail (email)
                -> mensagem (texto com area de texto)
                -->
                <form id="meuFormulario">
                    <label for="nomeForm">Nome:</label><br>
                    <input type="text" id="nomeForm" required>
                    <br><br>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" required>
                    <br><br> 
                    <label for="feedback">Feedback:</label><br>
                    <textarea id="feedback" required rows="6"></textarea>
                    <br>
                    <button type="button" id="botaoEnviar">Enviar Mensagem</button>
                </form>

                <p id="avisoMsg"></p>

                <script>
                    const botao = document.getElementById('botaoEnviar');
                    const statusMsg = document.getElementById('mensagemStatus');

                    // Criar constante -> buscar valores em input
                    botao.addEventListener("click", function() {
                        const nomeForm = document.getElementById("nomeForm").value;
                        const email = document.getElementById("email").value;
                        const feedback = document.getElementById("feedback").value;

                        // Se (campo Nome falso OU campo email falso OU campo feedback falso entao: aviso para preencher os campos)
                        if (!nomeForm || !email || !feedback) { 
                            avisoMsg.textContent = "Por favor, preencha todos os campos acima.";
                            avisoMsg.style.color = "red";
                            return;
                        }
                        
                        // uso de regex para controlar "patern" de email
                        const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!regexEmail.test(email)) {
                            avisoMsg.textContent = "E-mail inválido, por favor insira um email válido (exemplo@dominio.com).";
                            avisoMsg.style.color = "purple";
                            return;
                        }

                        // Caso todos campos tenham sido preenchidos apenas mensagem de sucesso, simulando envio.
                        avisoMsg.textContent = `Obrigado, ${nomeForm}! Um email foi enviado para Maurício.`;
                        avisoMsg.style.color = "blue";

                        // Limpa os dados inseridos nos campos do formulário
                        document.getElementById("meuFormulario").reset();
                });

                        // script para o mudar o tema abaixo
                        function alternarTema() {
                        const body = document.body;
                        const botao = document.getElementById("alternar");
                        
                        // Alterna a classe do tema escuro
                        body.classList.toggle("dark-mode");
                        
                        // Alterna o ícone do botao (lua pra escuro | sol pra claro) | localStorage pra manter salvo a config ao trocar pagina
                        if (body.classList.contains("dark-mode")) {
                            botao.textContent = "🌙";
                            localStorage.setItem("tema", "escuro");
                        } else {
                            botao.textContent = "☀️";
                            localStorage.setItem("tema", "claro");
                        }
                        }   
                        // Carrega tema do localStorage
                        window.onload = function() {
                            if (localStorage.getItem("tema") === "escuro") {
                                document.body.classList.add("dark-mode");
                                document.getElementById("theme-toggle").textContent = "🌙";
                            }
                        };

//"easter egg" deveria por o codigo dentro de scrip.js mas como tava começando a funcionar dps de caçar um dia todo um erro de digitação e como so lembrei depois que precisava do botão de tema escuro/claro acabei apenas copiando o script. Confesso a preguiça, mas melhor um armengue funcionando do que um quebrado :|
                </script>
